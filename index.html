<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spondhan-01 Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-red-600">Spondhan-01</h1>
        <p class="text-gray-600 text-sm">Monthly Installment Statement - 2026</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="card p-4 text-center border-l-4 border-green-500">
            <p class="text-xs uppercase text-gray-500 font-bold">Total Amount</p>
            <p id="grandTotal" class="text-xl font-bold text-gray-800">৳ 0.00</p>
        </div>
        <div class="card p-4 text-center border-l-4 border-red-500">
            <p class="text-xs uppercase text-gray-500 font-bold">Total Dues</p>
            <p id="totalDues" class="text-xl font-bold text-gray-800">৳ 0.00</p>
        </div>
    </div>

    <div class="space-y-4" id="memberList">
        </div>

    <div class="fixed bottom-6 right-6">
        <button onclick="saveData()" class="bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700">
            <i class="fas fa-save"></i> Save Data
        </button>
    </div>

    <script>
        // আপনার ইমেজ অনুযায়ী মেম্বার লিস্ট
        const members = [
            { id: 1, name: "Md. Tareq", paid: 15000, target: 66000 },
            { id: 2, name: "Simon Hoque", paid: 14000, target: 66000 },
            { id: 3, name: "Ismaiel Zabiullah", paid: 27000, target: 66000 },
            { id: 4, name: "Zunaid Bhuiyan", paid: 66000, target: 66000 },
            { id: 5, name: "Enamul Hoque Rimon", paid: 66000, target: 66000 },
            { id: 13, name: "Md Ali Afzal", paid: 63000, target: 66000 },
            // এখানে অন্য সব মেম্বারদের নাম যোগ করা যাবে...
        ];

        function renderMembers() {
            const listContainer = document.getElementById('memberList');
            let grandTotal = 0;
            let totalDues = 0;

            listContainer.innerHTML = '';

            members.forEach(m => {
                const dues = m.target - m.paid;
                grandTotal += m.paid;
                totalDues += dues;

                listContainer.innerHTML += `
                    <div class="card p-4 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-gray-700">${m.name}</p>
                            <p class="text-xs text-gray-500 italic">Target: ৳${m.target}</p>
                        </div>
                        <div class="text-right">
                            <input type="number" onchange="updatePaid(${m.id}, this.value)" 
                                value="${m.paid}" 
                                class="w-24 border rounded px-2 py-1 text-sm text-right font-semibold text-green-600">
                            <p class="text-xs ${dues > 0 ? 'text-red-500' : 'text-gray-400'} mt-1">
                                Dues: ৳${dues}
                            </p>
                        </div>
                    </div>
                `;
            });

            document.getElementById('grandTotal').innerText = '৳ ' + grandTotal.toLocaleString();
            document.getElementById('totalDues').innerText = '৳ ' + totalDues.toLocaleString();
        }

        function updatePaid(id, val) {
            const member = members.find(m => m.id === id);
            if(member) member.paid = parseFloat(val) || 0;
            renderMembers();
        }

        function saveData() {
            localStorage.setItem('spondhanData', JSON.stringify(members));
            alert('আপনার ডেটা মোবাইলে সেভ হয়েছে!');
        }

        // Load data on start
        window.onload = () => {
            const saved = localStorage.getItem('spondhanData');
            if(saved) {
                const parsed = JSON.parse(saved);
                // Update local array with saved values
                parsed.forEach(p => {
                    const m = members.find(mem => mem.id === p.id);
                    if(m) m.paid = p.paid;
                });
            }
            renderMembers();
        };
    </script>
</body>
</html>
