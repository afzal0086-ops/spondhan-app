```html
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spondhan-01 Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .admin-only { display: none; }
        .is-admin .admin-only { display: block; }
        .tab-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sticky-col { position: sticky; left: 0; background: white; z-index: 10; border-right: 1px solid #e2e8f0; }
        .sticky-right { position: sticky; right: 0; background: #f1f5f9; z-index: 10; border-left: 1px solid #e2e8f0; }
    </style>
</head>
<body class="pb-28">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-5 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter">Spondhan-01</h1>
                <p class="text-[10px] font-bold opacity-80 uppercase">সদস্য ব্যবস্থাপনা ও রিপোর্ট</p>
            </div>
            <button id="adminBtn" onclick="askAdminAccess()" class="bg-white/20 p-2.5 rounded-2xl border border-white/30 active:scale-90 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main id="mainContent" class="container mx-auto p-4 max-w-2xl">
        <!-- Summary Card -->
        <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-[2.5rem] p-8 text-white mb-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
            <div class="relative z-10">
                <p class="text-indigo-100 text-xs font-bold uppercase tracking-widest mb-1">সর্বমোট জমা (৳)</p>
                <h2 class="text-5xl font-black mb-6 tracking-tighter" id="totalDeposit">৳ ০</h2>
                <div class="grid grid-cols-2 gap-4 pt-6 border-t border-white/20">
                    <div>
                        <p class="text-[10px] text-indigo-200 font-bold uppercase">সদস্য সংখ্যা</p>
                        <p class="text-xl font-black" id="totalMembers">০ জন</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-indigo-200 font-bold uppercase">মোট বকেয়া</p>
                        <p class="text-xl font-black text-orange-300" id="totalDues">৳ ০</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="flex gap-8 mb-6 px-4 border-b border-gray-200 bg-white rounded-t-3xl pt-4 overflow-x-auto no-scrollbar">
            <button onclick="showSubPage('list')" id="tab-list" class="pb-3 font-black text-sm tab-active whitespace-nowrap">সদস্য তালিকা</button>
            <button onclick="showSubPage('dues')" id="tab-dues" class="pb-3 font-black text-sm text-gray-400 whitespace-nowrap">বকেয়া লিস্ট</button>
            <button onclick="showSubPage('settings')" id="tab-settings" class="admin-only pb-3 font-black text-sm text-gray-400 whitespace-nowrap">সেটিংস</button>
        </div>

        <!-- Sub Page: List -->
        <div id="sub-list" class="space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="font-black text-gray-800 text-lg">সদস্যদের প্রোফাইল</h2>
                <button onclick="toggleModal('memberModal')" class="admin-only bg-indigo-600 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-lg flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                    সদস্য যোগ
                </button>
            </div>
            <div id="memberList" class="space-y-4"></div>
        </div>

        <!-- Sub Page: Dues -->
        <div id="sub-dues" class="hidden space-y-4">
            <div id="duesList" class="space-y-3"></div>
        </div>

        <!-- Sub Page: Settings -->
        <div id="sub-settings" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                <h3 class="font-black text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    বছর ব্যবস্থাপনা
                </h3>
                <div class="flex gap-2 mb-4">
                    <input type="number" id="newYearInput" placeholder="উদা: ২০২৭" class="flex-1 p-4 bg-gray-50 rounded-2xl border border-gray-100 font-bold outline-none focus:ring-2 focus:ring-indigo-200">
                    <button onclick="addNewYear()" class="bg-indigo-600 text-white px-6 rounded-2xl font-black">যোগ</button>
                </div>
                <div id="yearsList" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                <h3 class="font-black text-gray-800 mb-4">ব্যাকআপ ফাইল</h3>
                <button onclick="exportData()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    ডাটা ডাউনলোড করুন
                </button>
            </div>
        </div>
    </main>

    <!-- Report Page (Desktop & Mobile Optimized) -->
    <main id="reportContent" class="container mx-auto p-4 hidden">
        <div class="flex justify-between items-center mb-6 px-2">
            <h2 class="text-2xl font-black text-gray-800">রিপোর্ট স্টেটমেন্ট</h2>
            <button onclick="showPage('dashboard')" class="bg-indigo-100 text-indigo-700 px-5 py-2.5 rounded-2xl font-black text-xs">ড্যাশবোর্ড</button>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100">
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full text-left min-w-[1200px] border-collapse">
                    <thead>
                        <tr class="bg-indigo-50/50 text-indigo-900 uppercase text-[10px] font-black tracking-widest">
                            <th class="p-6 sticky-col bg-indigo-50">সদস্যের নাম</th>
                            <th class="p-6 text-center border-b">অতিরিক্ত</th>
                            <tbody id="reportHeaderYears" class="contents"></tbody> <!-- Dynamic Years -->
                            <th class="p-6 text-right sticky-right bg-indigo-100">সর্বমোট</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="text-[13px]"></tbody>
                </table>
            </div>
        </div>
        <p class="mt-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest">পুরো রিপোর্ট দেখতে ডানে স্ক্রল করুন &rarr;</p>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-white/90 backdrop-blur-xl rounded-[2.5rem] shadow-2xl border border-white/50 flex justify-around items-center z-40 px-6">
        <button onclick="showPage('dashboard')" id="nav-home" class="flex flex-col items-center text-indigo-600 transition-all">
            <div class="p-2 rounded-2xl"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg></div>
            <span class="text-[10px] font-black uppercase">হোম</span>
        </button>
        <button onclick="showPage('report')" id="nav-report" class="flex flex-col items-center text-gray-400 transition-all">
            <div class="p-2 rounded-2xl"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
            <span class="text-[10px] font-black uppercase">রিপোর্ট</span>
        </button>
    </nav>

    <!-- Modals are Same as previous, but included for completeness -->
    <div id="memberModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl">
            <h2 class="text-xl font-black mb-6 text-gray-800">নতুন সদস্য</h2>
            <form id="memberForm" class="space-y-4">
                <input type="text" id="mName" placeholder="নাম" required class="w-full p-4 bg-gray-100 rounded-2xl outline-none font-bold">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="mAdd" placeholder="অতিরিক্ত" class="w-full p-4 bg-gray-100 rounded-2xl font-bold">
                    <input type="number" id="mDue" placeholder="বকেয়া" class="w-full p-4 bg-gray-100 rounded-2xl font-bold">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="toggleModal('memberModal')" class="flex-1 bg-gray-100 py-4 rounded-2xl font-bold">বাতিল</button>
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">সেভ</button>
                </div>
            </form>
        </div>
    </div>

    <div id="payModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl text-center">
            <h2 id="payMemberName" class="text-xl font-black mb-1">টাকা জমা</h2>
            <p id="currentDuesDisplay" class="text-orange-500 font-bold text-xs mb-6 uppercase tracking-wider"></p>
            <form id="payForm" class="space-y-4">
                <input type="hidden" id="payMemberIdx">
                <div class="grid grid-cols-2 gap-3">
                    <select id="payYear" class="p-4 bg-gray-50 rounded-2xl font-black border border-gray-100"></select>
                    <select id="payMonth" class="p-4 bg-gray-50 rounded-2xl font-black border border-gray-100">
                        <option value="Total">একসাথে (Total)</option>
                        <option value="January">জানুয়ারি</option><option value="February">ফেব্রুয়ারি</option><option value="March">মার্চ</option>
                        <option value="April">এপ্রিল</option><option value="May">মে</option><option value="June">জুন</option>
                        <option value="July">জুলাই</option>
                    </select>
                </div>
                <input type="number" id="payAmount" value="1000" class="w-full p-6 bg-indigo-50 rounded-3xl text-4xl font-black text-center text-indigo-700 outline-none">
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="toggleModal('payModal')" class="flex-1 bg-gray-100 py-4 rounded-2xl font-bold">বাতিল</button>
                    <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black">কনফার্ম জমা</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Updated Database from images
        const initialMembers = [
            { name: "Md. Tareq", additional: 10000, dues: 51000, payments: {"2021_Total": 4000, "2023_Total": 1000} },
            { name: "Simon Hoque", additional: 0, dues: 52000, payments: {"2021_Total": 3000, "2023_Total": 11000} },
            { name: "Ismaiel Zabiullah", additional: 10000, dues: 39000, payments: {"2021_Total": 4000, "2022_Total": 2000, "2023_Total": 11000} },
            { name: "Zunaid Bhuiyan", additional: 10000, dues: 0, payments: {"2021_Total": 4000, "2022_Total": 12000, "2023_Total": 12000, "2024_Total": 12000, "2025_Total": 12000, "2026_January": 1000, "2026_February": 1000, "2026_March": 1000, "2026_April": 1000} },
            { name: "Enamul Hoque Rimon", additional: 10000, dues: 0, payments: {"2021_Total": 4000, "2022_Total": 12000, "2023_Total": 12000, "2024_Total": 12000, "2025_Total": 12000, "2026_January": 1000, "2026_February": 1000, "2026_March": 1000, "2026_April": 1000} },
            { name: "Md. Al Amin Robin", additional: 0, dues: 43000, payments: {"2021_Total": 4000, "2022_Total": 7000, "2023_Total": 12000} },
            { name: "Sujan Khan", additional: 0, dues: 58000, payments: {"2021_Total": 4000, "2023_Total": 4000} },
            { name: "Rashedul Alam", additional: 10000, dues: 17000, payments: {"2021_Total": 4000, "2022_Total": 11000, "2023_Total": 12000, "2024_Total": 12000} },
            { name: "Arif Chowdhury", additional: 0, dues: 27000, payments: {"2021_Total": 4000, "2022_Total": 12000, "2023_Total": 12000, "2024_Total": 11000} },
            { name: "Md. Nazim Uddin Bhuiyan", additional: 0, dues: 39000, payments: {"2021_Total": 4000, "2022_Total": 7000, "2023_Total": 12000, "2024_Total": 4000} },
            { name: "Md Sagor Khandakar", additional: 10000, dues: 30000, payments: {"2021_Total": 4000, "2022_Total": 12000, "2023_Total": 10000} },
            { name: "Mohamad Safayet Khan", additional: 0, dues: 49000, payments: {"2021_Total": 4000, "2022_Total": 1000, "2023_Total": 12000} },
            { name: "Md Ali Afzal", additional: 10000, dues: 3000, payments: {"2021_Total": 4000, "2022_Total": 12000, "2023_Total": 12000, "2024_Total": 12000, "2025_Total": 12000, "2026_January": 1000} },
            { name: "Mosharof Hossain", additional: 10000, dues: 6000, payments: {"2021_Total": 4000, "2022_Total": 12000, "2023_Total": 12000, "2024_Total": 12000, "2025_Total": 10000} },
            { name: "Md. Lutfur Rahman (Rasel)", additional: 10000, dues: 46000, payments: {"2021_Total": 4000, "2022_Total": 6000} }
        ];

        let members = JSON.parse(localStorage.getItem('spondhan_v3')) || initialMembers;
        let activeYears = JSON.parse(localStorage.getItem('spondhan_years_v3')) || [2021, 2022, 2023, 2024, 2025, 2026];
        let isAdmin = false;

        function save() {
            localStorage.setItem('spondhan_v3', JSON.stringify(members));
            localStorage.setItem('spondhan_years_v3', JSON.stringify(activeYears));
            renderAll();
        }

        function calculateTotal(m) {
            return (Number(m.additional) || 0) + Object.values(m.payments || {}).reduce((a,b)=>a+b, 0);
        }

        function renderAll() {
            updateStats();
            renderMembers();
            renderDues();
            renderYearsSettings();
        }

        function updateStats() {
            const totalDep = members.reduce((s, m) => s + calculateTotal(m), 0);
            const totalDues = members.reduce((s, m) => s + (Number(m.dues) || 0), 0);
            document.getElementById('totalDeposit').innerText = `৳ ${totalDep.toLocaleString()}`;
            document.getElementById('totalMembers').innerText = `${members.length} জন`;
            document.getElementById('totalDues').innerText = `৳ ${totalDues.toLocaleString()}`;
        }

        function renderMembers() {
            document.getElementById('memberList').innerHTML = members.map((m, i) => `
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex justify-between items-center group active:scale-95 transition-all">
                    <div class="flex items-center gap-5 flex-1" onclick="if(isAdmin) openPayModal(${i})">
                        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black text-xl">${i+1}</div>
                        <div>
                            <h3 class="font-black text-gray-800 text-lg leading-none mb-1.5">${m.name}</h3>
                            <div class="flex gap-2">
                                <span class="bg-emerald-100 text-emerald-700 text-[9px] font-black px-2 py-0.5 rounded-full uppercase tracking-tighter">Add: ৳${m.additional}</span>
                                ${m.dues > 0 ? `<span class="bg-orange-100 text-orange-700 text-[9px] font-black px-2 py-0.5 rounded-full uppercase tracking-tighter">Due: ৳${m.dues}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="text-right" onclick="if(isAdmin) openPayModal(${i})">
                        <p class="text-xl font-black text-indigo-700 leading-none">৳${calculateTotal(m).toLocaleString()}</p>
                        <span class="text-[9px] font-black text-gray-300 uppercase block mt-1 tracking-widest">${isAdmin ? 'টাকা নিন' : 'জমা'}</span>
                    </div>
                    <button onclick="deleteMember(${i})" class="admin-only ml-4 p-2 text-red-100 hover:text-red-500 bg-red-50 rounded-xl transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `).join('');
        }

        function renderDues() {
            const duers = members.filter(m => (m.dues || 0) > 0);
            document.getElementById('duesList').innerHTML = duers.map(m => `
                <div class="bg-white p-5 rounded-[2rem] border-l-[8px] border-orange-500 shadow-sm flex justify-between items-center">
                    <div>
                        <h4 class="font-black text-gray-800">${m.name}</h4>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">Pending Installment</p>
                    </div>
                    <p class="text-xl font-black text-orange-600">৳${m.dues.toLocaleString()}</p>
                </div>
            `).join('');
        }

        function renderReport() {
            const sortedYears = [...activeYears].sort((a,b)=>a-b);
            const tbody = document.getElementById('reportTableBody');
            
            // Header Years
            const yearHeaders = sortedYears.map(y => `<th class="p-6 text-center border-b font-black min-w-[100px] text-gray-400">${y}</th>`).join('');
            document.getElementById('reportHeaderYears').innerHTML = yearHeaders;

            tbody.innerHTML = members.map(m => {
                let grand = calculateTotal(m);
                let yearCols = sortedYears.map(y => {
                    let yearSum = 0;
                    for(let k in m.payments) if(k.startsWith(y)) yearSum += m.payments[k];
                    return `<td class="p-6 text-center border-b font-bold ${yearSum > 0 ? 'text-emerald-600' : 'text-gray-200'}">৳${yearSum.toLocaleString()}</td>`;
                }).join('');

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-6 font-black text-gray-800 sticky-col shadow-[4px_0_15px_rgba(0,0,0,0.02)]">${m.name}</td>
                        <td class="p-6 text-center font-black text-indigo-500 border-b">৳${m.additional.toLocaleString()}</td>
                        ${yearCols}
                        <td class="p-6 text-right font-black text-indigo-700 bg-indigo-50/50 sticky-right shadow-[-4px_0_15px_rgba(0,0,0,0.02)]">৳${grand.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderYearsSettings() {
            document.getElementById('yearsList').innerHTML = activeYears.map(y => `
                <span class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-black text-xs border border-indigo-100 flex items-center gap-2">
                    ${y}
                    <button onclick="removeYear(${y})" class="text-red-300 hover:text-red-600 font-bold text-lg leading-none">&times;</button>
                </span>
            `).join('');
            document.getElementById('payYear').innerHTML = activeYears.sort((a,b)=>b-a).map(y => `<option value="${y}">${y}</option>`).join('');
        }

        window.askAdminAccess = () => {
            const p = prompt("অ্যাডমিন পাসওয়ার্ড (1234):");
            if(p === "1234") {
                isAdmin = !isAdmin;
                document.body.classList.toggle('is-admin', isAdmin);
                renderAll();
                alert(isAdmin ? "অ্যাডমিন মোড অন" : "অ্যাডমিন মোড অফ");
            }
        };

        window.addNewYear = () => {
            const y = parseInt(document.getElementById('newYearInput').value);
            if(y && !activeYears.includes(y)) { activeYears.push(y); activeYears.sort((a,b)=>a-b); save(); document.getElementById('newYearInput').value = ''; }
        };

        window.removeYear = (y) => { if(confirm(`${y} সরাতে চান?`)) { activeYears = activeYears.filter(x => x !== y); save(); } };

        window.showSubPage = (p) => {
            ['list', 'dues', 'settings'].forEach(s => {
                document.getElementById(`sub-${s}`).classList.toggle('hidden', s !== p);
                document.getElementById(`tab-${s}`).className = s === p ? 'pb-3 font-black text-sm tab-active whitespace-nowrap' : 'pb-3 font-black text-sm text-gray-400 whitespace-nowrap';
            });
        };

        window.showPage = (p) => {
            document.getElementById('mainContent').classList.toggle('hidden', p !== 'dashboard');
            document.getElementById('reportContent').classList.toggle('hidden', p !== 'report');
            document.getElementById('nav-home').className = p === 'dashboard' ? 'flex flex-col items-center text-indigo-600' : 'flex flex-col items-center text-gray-400';
            document.getElementById('nav-report').className = p === 'report' ? 'flex flex-col items-center text-indigo-600' : 'flex flex-col items-center text-gray-400';
            if(p === 'report') renderReport();
        };

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');

        window.openPayModal = (i) => {
            document.getElementById('payMemberIdx').value = i;
            document.getElementById('payMemberName').innerText = members[i].name;
            document.getElementById('currentDuesDisplay').innerText = `বকেয়া: ৳${members[i].dues}`;
            toggleModal('payModal');
        };

        window.deleteMember = (i) => { if(confirm(`${members[i].name}-কে বাদ দিতে চান?`)) { members.splice(i, 1); save(); } };

        document.getElementById('memberForm').onsubmit = (e) => {
            e.preventDefault();
            members.push({ 
                name: document.getElementById('mName').value, 
                additional: Number(document.getElementById('mAdd').value) || 0, 
                dues: Number(document.getElementById('mDue').value) || 0,
                payments: {} 
            });
            save(); toggleModal('memberModal'); e.target.reset();
        };

        document.getElementById('payForm').onsubmit = (e) => {
            e.preventDefault();
            const idx = document.getElementById('payMemberIdx').value;
            const amt = Number(document.getElementById('payAmount').value) || 0;
            const key = `${document.getElementById('payYear').value}_${document.getElementById('payMonth').value}`;
            members[idx].payments[key] = (members[idx].payments[key] || 0) + amt;
            if(members[idx].dues >= amt) members[idx].dues -= amt; else members[idx].dues = 0;
            save(); toggleModal('payModal');
        };

        window.exportData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({members, activeYears}));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr); a.setAttribute("download", `spondhan_v3_backup.json`); a.click();
        };

        // Run
        renderAll();
    </script>
</body>
</html>
